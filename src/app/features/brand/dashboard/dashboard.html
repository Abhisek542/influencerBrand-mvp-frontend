<div class="dashboard-container">

  <!-- Header -->
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Manage your campaigns and track applications</p>
  </div>

  <!-- Loader -->
  <p *ngIf="loading" class="loading-text">
    Loading dashboard...
  </p>

  <!-- Stats Grid -->
  <div class="stats-grid" *ngIf="dashboard">

    <app-stat-card
      label="Total Campaigns"
      [value]="dashboard.totalCampaigns"
      icon="📦">
    </app-stat-card>

    <app-stat-card
      label="Active Campaigns"
      [value]="dashboard.activeCampaigns"
      icon="⏱">
    </app-stat-card>

    <app-stat-card
      label="Expired Campaigns"
      [value]="dashboard.expiredCampaigns"
      icon="⌛">
    </app-stat-card>

    <app-stat-card
      label="Total Budget"
      [value]="dashboard.totalBudget"
      icon="💰">
    </app-stat-card>

  </div>

  <!-- Error State -->
  <app-empty-state
    *ngIf="!loading && error"
    title="Error"
    [message]="error">
  </app-empty-state>

  <!-- Applications Section -->
  <div class="applications-section">
    <h2>Applications</h2>

    <app-empty-state
      title="No Applications Yet"
      description="Applications from influencers will appear here">
    </app-empty-state>
  </div>

</div>
