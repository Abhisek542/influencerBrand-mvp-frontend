<div class="dashboard-container">

  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Manage your campaigns and track applications</p>
  </header>

  <div *ngIf="loading" class="loading-wrapper">
    <p class="loading-text">Loading dashboard...</p>
  </div>

  <div class="error-message" *ngIf="!loading && errorMessage">
    <div class="error-icon">!</div>
    <div class="error-content">
      <p class="error-title">Unable to load dashboard</p>
      <p class="error-text">{{ errorMessage }}</p>
      <button (click)="loadDashboard()" class="retry-btn">Retry</button>
    </div>
  </div>

  <ng-container *ngIf="!loading && !errorMessage">
    
    <div class="stats-grid" *ngIf="dashboard">
      <app-stat-card
        label="Total Campaigns"
        [value]="dashboard.totalCampaigns"
        icon="📦">
      </app-stat-card>

      <app-stat-card
        label="Active Campaigns"
        [value]="dashboard.activeCampaigns"
        icon="⏱">
      </app-stat-card>

      <app-stat-card
        label="Expired Campaigns"
        [value]="dashboard.expiredCampaigns"
        icon="⌛">
      </app-stat-card>

      <app-stat-card
        label="Total Budget"
        [value]="(dashboard.totalBudget | currency) ?? '$0.00'"
        icon="💰">
      </app-stat-card>
    </div>

    <section class="applications-section">
      <h2>Applications</h2>
      <app-empty-state
        *ngIf="!dashboard?.totalApplications"
        title="No Applications Yet"
        description="Applications from influencers will appear here">
      </app-empty-state>
