<div class="dashboard-container">

  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Manage your campaigns and track applications</p>
  </header>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-wrapper">
    <div class="spinner"></div>
    <span>Loading dashboard...</span>
  </div>

  <!-- Error -->
  <div class="error-message" *ngIf="!loading && errorMessage">
    <div class="error-icon">!</div>
    <div class="error-content">
      <p class="error-title">Unable to load dashboard</p>
      <p class="error-text">{{ errorMessage }}</p>
    </div>
  </div>

  <!-- Main Content -->
  <ng-container *ngIf="!loading && !errorMessage">

    <!-- Stats Grid -->
    <div class="stats-grid" *ngIf="dashboard">
      <app-stat-card
        label="Total Campaigns"
        [value]="dashboard.totalCampaigns"
        icon="📦">
      </app-stat-card>

      <app-stat-card
        label="Active Campaigns"
        [value]="dashboard.activeCampaigns"
        icon="⏱">
      </app-stat-card>

      <app-stat-card
        label="Expired Campaigns"
        [value]="dashboard.expiredCampaigns"
        icon="⌛">
      </app-stat-card>

      <app-stat-card
        label="Total Budget"
        [value]="(dashboard.totalBudget | currency:'INR':'symbol-narrow':'1.0-0') ?? '₹0'"
        icon="💰">
      </app-stat-card>
    </div>

    <!-- Campaigns Section -->
    <section class="campaigns-section">
      <h2>Campaigns</h2>

      <div class="campaigns-list">
        <ng-container *ngIf="campaigns.length > 0; else noCampaigns">
          <app-campaign-card
            *ngFor="let campaign of campaigns"
            [title]="campaign.title"
            [brand]="campaign.brandName"
            [niche]="campaign.niche"
            [budget]="campaign.budget"
            [status]="campaign.status"
            [showApplications]="true"
            [campaignId]="campaign.id">
          </app-campaign-card>
        </ng-container>

        <ng-template #noCampaigns>
          <app-empty-state
            title="No campaigns yet"
            description="Create your first campaign to start finding influencers">
          </app-empty-state>
        </ng-template>
      </div>

    </section>

  </ng-container>

</div>
