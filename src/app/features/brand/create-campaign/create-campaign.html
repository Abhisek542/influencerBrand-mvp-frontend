<div class="page">
  <h1>Create Campaign</h1>
  <p class="subtitle">
    Launch a new influencer marketing campaign
  </p>

  <div class="error-message" *ngIf="errorMessage">
    <div class="error-stripe"></div>
    <div class="error-icon">!</div>
    <div class="error-content">
      <p class="error-title">Unable to create campaign</p>
      <p class="error-text">{{ errorMessage }}</p>
    </div>
  </div>

  <form
    class="form-card"
    (ngSubmit)="createCampaign()"
    #campaignForm="ngForm"
  >
    <label>Campaign Title *</label>
    <input
      type="text"
      name="title"
      [(ngModel)]="campaign.title"
      placeholder="e.g. Summer Fashion Collection Launch"
      required
    />

    <label>Description *</label>
    <textarea
      name="description"
      [(ngModel)]="campaign.description"
      placeholder="Describe your campaign goals, deliverables, and expectations..."
      required
    ></textarea>

    <label>Brand Name *</label>
    <input
      type="text"
      name="brandName"
      [(ngModel)]="campaign.brandName"
      placeholder="e.g. Nike, Boat, Zomato"
      required
    />

    <div class="row">
      <div>
        <label>Budget *</label>
        <input
          type="text"
          name="budget"
          [(ngModel)]="campaign.budget"
          placeholder="5000"
          required
        />
      </div>

      <div>
        <label>Niche *</label>
        <input
          type="text"
          name="niche"
          [(ngModel)]="campaign.niche"
          placeholder="e.g. Tech, Fitness, Fashion"
          required
        />
      </div>
    </div>

    <label>Deadline *</label>
    <input
      type="date"
      name="deadline"
      [(ngModel)]="campaign.deadline"
      required
    />

    <div class="actions">
      <button
        class="primary"
        type="submit"
        [disabled]="campaignForm.invalid"
      >
        Create Campaign
      </button>

      <button type="button" class="secondary">
        Cancel
      </button>
    </div>
  </form>
</div>
