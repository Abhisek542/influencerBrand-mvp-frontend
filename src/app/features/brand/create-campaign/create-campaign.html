<div class="page">

  <h1>Create Campaign</h1>
  <p class="subtitle">
    Launch a new influencer marketing campaign
  </p>

  <form
    class="form-card"
    (ngSubmit)="createCampaign()"
    #campaignForm="ngForm"
  >

    <!-- Title -->
    <label>Campaign Title *</label>
    <input
      type="text"
      name="title"
      [(ngModel)]="campaign.title"
      placeholder="e.g. Summer Fashion Collection Launch"
      required
    />

    <!-- Description -->
    <label>Description *</label>
    <textarea
      name="description"
      [(ngModel)]="campaign.description"
      placeholder="Describe your campaign goals, deliverables, and expectations..."
      required
    ></textarea>

    <!-- Brand Name (REQUIRED BY BACKEND) -->
    <label>Brand Name *</label>
    <input
      type="text"
      name="brandName"
      [(ngModel)]="campaign.brandName"
      placeholder="e.g. Nike, Boat, Zomato"
      required
    />

    <!-- Row -->
    <div class="row">

      <div>
        <label>Budget *</label>
        <input
          type="text"
          name="budget"
          [(ngModel)]="campaign.budget"
          placeholder="5000"
          required
        />
      </div>

      <div>
        <label>Niche *</label>
        <input
          type="text"
          name="niche"
          [(ngModel)]="campaign.niche"
          placeholder="e.g. Tech, Fitness, Fashion"
          required
        />
      </div>

    </div>

    <!-- Deadline (REQUIRED BY BACKEND) -->
    <label>Deadline *</label>
    <input
      type="date"
      name="deadline"
      [(ngModel)]="campaign.deadline"
      placeholder="e.g. 2024-12-31"
      required
    />

    <!-- Actions -->
    <div class="actions">
      <button
        class="primary"
        type="submit"
        [disabled]="campaignForm.invalid"
      >
        Create Campaign
      </button>

      <button type="button" class="secondary">
        Cancel
      </button>
    </div>

  </form>
</div>
