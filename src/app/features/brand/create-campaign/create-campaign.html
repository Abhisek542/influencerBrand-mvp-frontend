<div class="page">
  <h1>Create Campaign</h1>
  <p class="subtitle">Launch a new influencer marketing campaign</p>

  <!-- Success message -->
  <div class="success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <!-- Error message -->
  <div class="error-message" *ngIf="errorMessage">
    <div class="error-stripe"></div>
    <div class="error-icon">!</div>
    <div class="error-content">
      <p class="error-title">Unable to create campaign</p>
      <p class="error-text">{{ errorMessage }}</p>
    </div>
  </div>

  <form
    class="form-card"
    (ngSubmit)="createCampaign()"
    #campaignForm="ngForm"
  >
    <label for="title">Campaign Title *</label>
    <input
      id="title"
      type="text"
      name="title"
      [(ngModel)]="campaign.title"
      placeholder="e.g. Summer Fashion Collection Launch"
      required
    />

    <label for="description">Description *</label>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="campaign.description"
      placeholder="Describe your campaign goals, deliverables, and expectations..."
      required
    ></textarea>

    <label for="brandName">Brand Name *</label>
    <input
      id="brandName"
      type="text"
      name="brandName"
      [(ngModel)]="campaign.brandName"
      placeholder="e.g. Nike, Boat, Zomato"
      required
    />

    <div class="row">
      <div>
        <label for="budget">Budget (₹) *</label>
        <input
          id="budget"
          type="number"
          name="budget"
          [(ngModel)]="campaign.budget"
          placeholder="5000"
          min="0"
          required
        />
      </div>

      <div>
        <label for="niche">Niche *</label>
        <select
          id="niche"
          name="niche"
          [(ngModel)]="campaign.niche"
          required
        >
          <option value="">Select a niche...</option>
          <option value="Tech">Tech</option>
          <option value="Fitness">Fitness</option>
          <option value="Fashion">Fashion</option>
          <option value="Beauty">Beauty</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Gaming">Gaming</option>
          <option value="Lifestyle">Lifestyle</option>
        </select>
      </div>
    </div>

    <label for="deadline">Deadline *</label>
    <input
      id="deadline"
      type="date"
      name="deadline"
      [(ngModel)]="campaign.deadline"
      required
    />

    <div class="actions">
      <button
        class="primary"
        type="submit"
        [disabled]="campaignForm.invalid"
      >
        Create Campaign
      </button>

      <button type="button" class="secondary" (click)="cancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
