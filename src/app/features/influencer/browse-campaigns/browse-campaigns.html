<div class="page-header">
  <h1>Browse Campaigns</h1>
  <p>Discover and apply to campaigns that match your brand</p>
</div>

<!-- Search + Filter -->
<div class="toolbar">

  <input
    type="text"
    placeholder="Search campaigns..."
    class="search-input"
    [(ngModel)]="searchTitle"
    (input)="onSearchChange()"
  />

  <select
    class="filter"
    [(ngModel)]="selectedNiche"
    (change)="onFilterChange()"
  >
    <option value="">All Niches</option>
    <option value="Tech">Tech</option>
    <option value="Fitness">Fitness</option>
    <option value="Fashion">Fashion</option>
  </select>

</div>

<!-- Loading -->
<div *ngIf="loading">
  <p>Loading campaigns...</p>
</div>

<div class="error-message" *ngIf="!loading && errorMessage">
  <div class="error-icon">!</div>
  <div class="error-content">
    <p class="error-title">Unable to load campaigns</p>
    <p class="error-text">{{ errorMessage }}</p>
  </div>
</div>
<!-- Campaign Grid -->
<div class="campaign-grid" *ngIf="!loading && campaigns.length > 0">

  <app-campaign-card
    *ngFor="let c of campaigns"
    [campaignId]="c.id"
    [title]="c.title"
    [brand]="c.brandName"
    [niche]="c.niche"
    [budget]="c.budget"
    [applied]="c.applied"
    status="Open"
    [showApplyButton]="true"
    (applyClicked)="openApplyModal($event)">
  </app-campaign-card>

</div>


<!-- Pagination -->
<div class="pagination" *ngIf="totalPages > 1">

  <button (click)="prevPage()" [disabled]="page === 0">
    ← Prev
  </button>

  <button
    *ngFor="let p of pages"
    (click)="goToPage(p)"
    [class.active]="page === p"
  >
    {{ p + 1 }}
  </button>

  <button (click)="nextPage()" [disabled]="page === totalPages - 1">
    Next →
  </button>

</div>


<!-- APPLY MODAL -->
<div class="modal-overlay" *ngIf="showApplyModal">

  <div class="modal">

    <h2>Apply to Campaign</h2>

    <input
      type="text"
      placeholder="Influencer Name"
      [(ngModel)]="applicationForm.influencerName"
    />

    <input
      type="text"
      placeholder="Platform"
      [(ngModel)]="applicationForm.platform"
    />

    <input
      type="text"
      placeholder="Niche"
      [(ngModel)]="applicationForm.niche"
    />

    <textarea
      placeholder="Message"
      [(ngModel)]="applicationForm.message">
    </textarea>

    <div class="modal-actions">

      <button (click)="closeApplyModal()">
        Cancel
      </button>

      <button (click)="submitApplication()">
        Submit Application
      </button>

    </div>

  </div>

</div>


<!-- Empty State -->
<app-empty-state
  *ngIf="!loading && campaigns.length === 0 && !errorMessage"
  title="No campaigns available"
  description="Check back later for new campaigns">
</app-empty-state>
