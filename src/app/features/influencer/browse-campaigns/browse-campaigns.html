<div class="page-header">
  <h1>Browse Campaigns</h1>
  <p>Discover and apply to campaigns that match your brand</p>
</div>

<!-- Search + Filter -->
<div class="toolbar">
  <input
    type="text"
    placeholder="Search campaigns..."
    class="search-input"
  />

  <select class="filter">
    <option>All Niches</option>
    <option>Tech</option>
    <option>Fitness</option>
    <option>Fashion</option>
  </select>
</div>

<!-- Loading -->
<div *ngIf="loading">
  <p>Loading campaigns...</p>
</div>

<!-- Campaign Grid -->
<div class="campaign-grid" *ngIf="!loading && campaigns.length > 0">

  <app-campaign-card
    *ngFor="let c of campaigns"
    [title]="c.title"
    [brand]="c.brandName"
    [niche]="c.niche"
    [budget]="c.budget"
    status="Open">
  </app-campaign-card>

</div>

<!-- Empty State -->
<app-empty-state
  *ngIf="!loading && campaigns.length === 0"
  title="No campaigns available"
  description="Check back later for new campaigns">
</app-empty-state>
