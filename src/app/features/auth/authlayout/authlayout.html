<div class="auth-wrap">
  <div class="auth-left">
    <div class="auth-brand">
      <a class="auth-brand-name" routerLink="/">Influencer<span>Hub</span></a>
      <div class="auth-brand-tag">Agentic collaboration</div>
    </div>
    <div class="auth-hero">
      <app-mascot [size]="112" label="Pip, the InfluencerHub mascot" />
      <h1>Your AI crew is<br/><em>ready when you are</em></h1>
      <p>Agents write campaigns, review applicants and draft pitches, then wait for your approval.</p>
    </div>
    <ul class="auth-crew">
      <li>Campaign Copilot</li>
      <li>Applicant Shortlist</li>
      <li>Opportunity Scout</li>
    </ul>
  </div>
  <div class="auth-right">
    <router-outlet></router-outlet>
  </div>
</div>
