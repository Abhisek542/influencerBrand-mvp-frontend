<div class="form-panel">
  <div class="form-panel__inner">

    <div class="form-header">
      <h1 class="form-header__title">Create Account</h1>
      <p class="form-header__sub">Join the InfluencerHub community</p>
    </div>

    <!-- Error Message -->
    <div class="alert alert--error" *ngIf="errorMessage" role="alert">
      <div class="alert__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="alert__body">
        <p class="alert__title">Registration failed</p>
        <p class="alert__text">{{ errorMessage }}</p>
      </div>
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="submit()" #form="ngForm" class="register-form" novalidate>

      <div class="field-group">
        <label class="field-label" for="username">Username</label>
        <div class="field-input-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="username"
            type="text"
            class="field-input"
            placeholder="your_username"
            [(ngModel)]="username"
            name="username"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <div class="field-input-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            id="email"
            type="email"
            class="field-input"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="field-input-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            id="password"
            type="password"
            class="field-input"
            placeholder="Min. 8 characters"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">I am a...</label>
        <div class="role-toggle">
          <label class="role-option" [class.role-option--active]="role === 'BRAND'">
            <input type="radio" name="role" value="BRAND" [(ngModel)]="role" required hidden/>
            <span class="role-option__icon">🏢</span>
            <span class="role-option__label">Brand</span>
            <span class="role-option__desc">Launch campaigns</span>
          </label>
          <label class="role-option" [class.role-option--active]="role === 'INFLUENCER'">
            <input type="radio" name="role" value="INFLUENCER" [(ngModel)]="role" required hidden/>
            <span class="role-option__icon">🌟</span>
            <span class="role-option__label">Influencer</span>
            <span class="role-option__desc">Apply to campaigns</span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="form.invalid || loading || !role">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading" class="submit-btn__loading">
          <span class="spinner"></span>
          Creating...
        </span>
      </button>

    </form>

    <p class="form-footer">
      Already have an account?
      <a routerLink="/auth/login" class="form-footer__link">Sign in</a>
    </p>

  </div>
</div>

<!-- ✅ Modal outside form-panel — overlays the full page safely -->
<app-success-modal
  [visible]="showSuccessModal"
  title="Registration Successful!"
  message="Your account has been created. Click OK to login."
  (confirmed)="onModalConfirm()">
</app-success-modal>
