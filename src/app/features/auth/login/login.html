<div class="login-box">

  <!-- Success banner -->
  <div class="success-banner" *ngIf="justRegistered">
    <span>✓</span> Account created successfully! Please sign in.
  </div>

  <!-- Pill -->
  <div class="login-pill">
    <div class="login-pill-dot"></div>
    <span class="login-pill-text">Welcome back</span>
  </div>

  <!-- Heading -->
  <div class="login-eyebrow">Sign in</div>
  <h2 class="login-title">Good to see you</h2>
  <p class="login-sub">Enter your credentials to continue</p>

  <!-- Error alert -->
  <div class="login-error" *ngIf="error">
    <div class="login-error-stripe"></div>
    <div class="login-error-body">{{ error }}</div>
  </div>

  <form #loginForm="ngForm" (ngSubmit)="login()">

    <!-- Email -->
    <div class="form-group">
      <label for="login-email">Email address</label>
      <input
        id="login-email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        email
        autocomplete="email"
        #emailRef="ngModel"
        placeholder="you@example.com"
      />
      <span class="field-error" *ngIf="emailRef.touched && emailRef.invalid">
        Enter a valid email address
      </span>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="login-password">Password</label>
      <div class="input-with-toggle">
        <input
          id="login-password"
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          #passwordRef="ngModel"
          placeholder="••••••••"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? '🙈' : '👁' }}
        </button>
      </div>
      <span class="field-error" *ngIf="passwordRef.touched && passwordRef.invalid">
        Password is required
      </span>
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="login-btn"
      [disabled]="loginForm.invalid || loading"
    >
      {{ loading ? 'Signing in...' : 'Sign in →' }}
    </button>

  </form>

  <p class="login-footer">
    Don't have an account?
    <a routerLink="/auth/register">Create one</a>
  </p>

</div>
