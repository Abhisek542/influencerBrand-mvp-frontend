<div class="change-password-card">
  <h2>Change Password</h2>

  <div class="message message--success" *ngIf="successMessage" role="status">{{ successMessage }}</div>
  <div class="message message--error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

  <form #passwordForm="ngForm" (ngSubmit)="submit(passwordForm)" novalidate>
    <div class="form-group">
      <label for="current-password">Current password</label>
      <input
        id="current-password"
        type="password"
        name="currentPassword"
        [(ngModel)]="currentPassword"
        autocomplete="current-password"
      />
    </div>

    <div class="form-group">
      <label for="new-password">New password</label>
      <input
        id="new-password"
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
        placeholder="Min. 8 characters"
      />
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirm new password</label>
      <input
        id="confirm-password"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
      />
    </div>

    <div class="actions">
      <button type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Change Password' }}</button>
    </div>
  </form>
</div>
