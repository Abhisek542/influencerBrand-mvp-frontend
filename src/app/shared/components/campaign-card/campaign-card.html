<div class="campaign-card">

  <div class="top-row">
    <div>
      <h3>{{ title }}</h3>
      <p class="brand">{{ brand }}</p>
    </div>

    <span *ngIf="status || showAppications" class="status-pill">
      {{ status || 'active' }}
    </span>
  </div>

  <p class="meta">Niche: {{ niche }}</p>
  <p class="meta">Budget: {{ budget }}</p>

 <div class="actions">

  <!-- Brand Side -->
  <button
    *ngIf="showAppications"
    class="secondary"
    [routerLink]="['/brand/applications', campaignId]"
  >
    View Applications
  </button>

  <!-- Influencer Side -->
  <button
    *ngIf="showApplyButton"
    class="primary"
    (click)="applyClicked.emit(campaignId)"
  >
    Apply
  </button>

  <button class="danger">
    🗑
  </button>

</div>

 </div>
